name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser

      - name: Run unit tests
        shell: pwsh
        run: ./Tests/Run-Tests.ps1

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = @{
            ExcludeRules = @(
              'PSAvoidUsingWriteHost'
              'PSAvoidUsingEmptyCatchBlock'
              'PSUseSingularNouns'
              'PSUseShouldProcessForStateChangingFunctions'
            )
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings -Severity Error,Warning
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            throw "$($results.Count) PSScriptAnalyzer issue(s) found"
          }

  # Publishes to the PowerShell Gallery when the PSGALLERY_API_KEY secret is
  # configured; otherwise skips with a notice so tag pushes never fail on a
  # missing key. The staged-folder build keeps tests/docs/reports out of the
  # package (Publish-PSResource ships the entire target folder).
  publish-gallery:
    needs: [test, lint]
    runs-on: ubuntu-latest
    env:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Publish to PowerShell Gallery
        if: env.PSGALLERY_API_KEY != ''
        shell: pwsh
        run: |
          $tagVer = '${{ github.ref_name }}'.TrimStart('v')
          $m = Test-ModuleManifest ./CISAzureBenchmark.psd1
          if ($m.Version.ToString() -ne $tagVer) {
            throw "Manifest version $($m.Version) does not match tag $tagVer — bump ModuleVersion in CISAzureBenchmark.psd1 before tagging."
          }
          $staged = ./scripts/Build-ModulePackage.ps1 -OutputPath $env:RUNNER_TEMP | Select-Object -Last 1
          Publish-PSResource -Path $staged -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
          Write-Host "Published CISAzureBenchmark v$tagVer to the PowerShell Gallery."

      - name: Gallery publish skipped
        if: env.PSGALLERY_API_KEY == ''
        run: echo "PSGALLERY_API_KEY secret not configured — skipping PowerShell Gallery publish."

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
          body: |
            ## CISAzureBenchmark-PS ${{ github.ref_name }}

            **Benchmark:** CIS Microsoft Azure Foundations Benchmark v6.0.0
            **Coverage:** See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for current control coverage

            ### Requirements
            - PowerShell 7.0+
            - Az PowerShell module (`Connect-AzAccount` before running)

            ### Quick Start
            ```powershell
            Connect-AzAccount
            .\Invoke-CISAzureAudit.ps1
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
