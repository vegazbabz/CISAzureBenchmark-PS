name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser

      - name: Run unit tests
        shell: pwsh
        run: ./Tests/Run-Tests.ps1

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = @{
            ExcludeRules = @(
              'PSAvoidUsingWriteHost'
              'PSAvoidUsingEmptyCatchBlock'
              'PSUseBOMForUnicodeEncodedFile'
              'PSUseSingularNouns'
              'PSUseShouldProcessForStateChangingFunctions'
            )
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings -Severity Error,Warning
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            throw "$($results.Count) PSScriptAnalyzer issue(s) found"
          }

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
          body: |
            ## CISAzureBenchmark-PS ${{ github.ref_name }}

            **Benchmark:** CIS Microsoft Azure Foundations Benchmark v6.0.0
            **Coverage:** See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for current control coverage

            ### Requirements
            - PowerShell 7.0+
            - Az PowerShell module (`Connect-AzAccount` before running)

            ### Quick Start
            ```powershell
            Connect-AzAccount
            .\Invoke-CISAzureAudit.ps1
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
