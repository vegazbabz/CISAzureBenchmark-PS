name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser

      # Coverage (with the floor gate + job summary) only on the Linux leg —
      # breakpoint instrumentation slows the suite, once per run is enough.
      # Baseline was 82.7% when the 80% floor was set; ratchet it up over time.
      - name: Run unit tests
        shell: pwsh
        run: ./Tests/Run-Tests.ps1 ${{ matrix.os == 'ubuntu-latest' && '-Coverage -MinCoverage 80' || '' }}

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            throw "$($results.Count) PSScriptAnalyzer issue(s) found"
          }
          Write-Host 'PSScriptAnalyzer: no issues found' -ForegroundColor Green

      # The report is a self-contained HTML file whose JavaScript is inline and
      # never parsed by any tool before a browser opens it. Generate a synthetic
      # report, extract the <script> blocks, and node --check each one so a JS
      # syntax error in Private/Report.ps1 fails the build instead of shipping.
      - name: Validate report inline JavaScript
        shell: pwsh
        run: ./scripts/Test-ReportScript.ps1 -RequireJsEngine

      # Az modules are RequiredModules (so Gallery installs pull them in
      # automatically), which means manifest validation and the import smoke
      # test need them present on the runner. Cached — a cold install takes a
      # few minutes, a restore takes seconds.
      - name: Cache Az modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/powershell/Modules
          key: az-modules-${{ runner.os }}-${{ hashFiles('CISAzureFoundationsBenchmark.psd1') }}

      - name: Install Az module dependencies
        shell: pwsh
        run: |
          $required = (Import-PowerShellDataFile ./CISAzureFoundationsBenchmark.psd1).RequiredModules
          $missing = @($required | Where-Object { -not (Get-Module -ListAvailable $_) })
          if ($missing) { Install-PSResource -Name $missing -TrustRepository -Scope CurrentUser }

      - name: Validate module manifest
        shell: pwsh
        run: |
          $m = Test-ModuleManifest ./CISAzureFoundationsBenchmark.psd1 -ErrorAction Stop
          Write-Host "Manifest OK: $($m.Name) v$($m.Version)"
          Import-Module ./CISAzureFoundationsBenchmark.psd1 -Force -ErrorAction Stop
          $cmd = Get-Command Invoke-CISAzureAudit -Module CISAzureFoundationsBenchmark -ErrorAction Stop
          Write-Host "Module imports and exports $($cmd.Name)."
