name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser

      - name: Run unit tests
        shell: pwsh
        run: ./Tests/Run-Tests.ps1

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = @{
            ExcludeRules = @(
              'PSAvoidUsingWriteHost'
              'PSAvoidUsingEmptyCatchBlock'
              'PSUseSingularNouns'
              'PSUseShouldProcessForStateChangingFunctions'
            )
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings -Severity Error,Warning
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            throw "$($results.Count) PSScriptAnalyzer issue(s) found"
          }
          Write-Host 'PSScriptAnalyzer: no issues found' -ForegroundColor Green
