name: Bug report
description: Report a bug in CISAzureBenchmark-PS
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or steps to reproduce the issue.
      placeholder: |
        1. Connect-AzAccount
        2. .\Invoke-CISAzureAudit.ps1 -Level 1
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PowerShell and Az module versions.
      placeholder: |
        PowerShell: 7.x
        Az.Accounts: x.x.x
        OS: Windows / Linux / macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error messages or log output.
      render: text
